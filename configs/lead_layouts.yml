# ==========================================================================
# Шаблоны раскладок отведений ЭКГ (схема как у Ahus-AIM/Open-ECG-Digitizer).
#   grid — список СТРОК; каждая строка — список отведений по колонкам.
#   Строка с одинаковыми отведениями (и cols>1) — ритм-строка на всю ширину (10с).
# Длительность клетки блока = paper_seconds / cols; ритм-строка = paper_seconds.
# Авто-выбор формата — по числу строк И колонок (см. src/layout/stage.py).
# ==========================================================================

paper_seconds: 10

layouts:
  # --- 3×4 семейство (cols=4) ---
  "3x4":                      # 3×4 без ритм-строки
    description: "3×4 (без ритма)"
    cols: 4
    grid:
      - ["I",   "aVR", "V1", "V4"]
      - ["II",  "aVL", "V2", "V5"]
      - ["III", "aVF", "V3", "V6"]

  "3x4_1R":                   # 3×4 + 1 ритм-строка (II) — стандарт PhysioNet 2024
    description: "3×4 + ритм II"
    cols: 4
    grid:
      - ["I",   "aVR", "V1", "V4"]
      - ["II",  "aVL", "V2", "V5"]
      - ["III", "aVF", "V3", "V6"]
      - ["II",  "II",  "II", "II"]

  "3x4_3R":                   # 3×4 + 3 ритм-строки (V1, II, V5)
    description: "3×4 + 3 ритма (V1, II, V5)"
    cols: 4
    grid:
      - ["I",   "aVR", "V1", "V4"]
      - ["II",  "aVL", "V2", "V5"]
      - ["III", "aVF", "V3", "V6"]
      - ["V1",  "V1",  "V1", "V1"]
      - ["II",  "II",  "II", "II"]
      - ["V5",  "V5",  "V5", "V5"]

  # --- 6×2 семейство (cols=2): слева отведения от конечностей, справа грудные ---
  "6x2":                      # 6×2 без ритма
    description: "6×2 (без ритма)"
    cols: 2
    grid:
      - ["I",   "V1"]
      - ["II",  "V2"]
      - ["III", "V3"]
      - ["aVR", "V4"]
      - ["aVL", "V5"]
      - ["aVF", "V6"]

  "6x2_1R":                   # 6×2 + ритм II
    description: "6×2 + ритм II"
    cols: 2
    grid:
      - ["I",   "V1"]
      - ["II",  "V2"]
      - ["III", "V3"]
      - ["aVR", "V4"]
      - ["aVL", "V5"]
      - ["aVF", "V6"]
      - ["II",  "II"]

  # --- 12×1 (cols=1) ---
  "12x1":                     # каждое отведение на всю ширину (10с)
    description: "12×1 (каждое отведение 10с)"
    cols: 1
    grid:
      - ["I"]
      - ["II"]
      - ["III"]
      - ["aVR"]
      - ["aVL"]
      - ["aVF"]
      - ["V1"]
      - ["V2"]
      - ["V3"]
      - ["V4"]
      - ["V5"]
      - ["V6"]
